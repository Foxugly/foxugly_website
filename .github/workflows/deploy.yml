name: CI & Déploiement

# Sur push main : tests (backend + frontend + e2e) PUIS, s'ils passent, déploiement
# via le pattern S3-bundle (build CI → S3 → SSM → instance).
#
# Secrets requis (pour le déploiement uniquement) :
#   AWS_DEPLOY_ROLE_ARN  rôle IAM assumé par OIDC (s3:PutObject, ssm:SendCommand…)
#   EC2_INSTANCE_ID      ex : i-0123456789abcdef0
#   AWS_REGION           optionnel (défaut : eu-west-1)

on:
  push:
    branches: [main]
  # Sans ce declencheur, une PR n'etait verifiee par RIEN : la suite ne tournait
  # qu'apres le merge, sur la branche qui deploie. Constate le 2026-07-30 --
  # plusieurs PR Dependabot ouvertes sur ce depot n'avaient aucun check.
  # Seul `test` tourne ici ; `deploy` reste garde par son `if`.
  pull_request:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  # Les PR ont chacune leur groupe : partager `deploy-prod` faisait annuler les
  # runs de PR en attente (un seul « pending » par groupe), donc les checks requis
  # ne passaient jamais sur des PR Dependabot ouvertes ensemble (2026-10-20).
  group: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || 'deploy-prod' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  AWS_REGION: ${{ secrets.AWS_REGION || 'eu-west-1' }}
  BUCKET: foxugly-deploy
  # Opt-in Node 24 pour les actions JS encore déclarées en node20
  # (aws-actions/configure-aws-credentials@v5 n'a pas encore de release node24).
  # Évite le warning de dépréciation ; GitHub forcera ce comportement le 16/06/2026.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  # ---------------------------------------------------------------------------
  lint-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Lint backend (ruff)
        working-directory: backend
        run: |
          pip install ruff
          ruff check .

  # ---------------------------------------------------------------------------
  lint-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Lint frontend (ESLint)
        working-directory: frontend
        run: |
          npm ci
          npx ng lint   # n'échoue que sur les erreurs ; les warnings a11y sont tolérés

  # ---------------------------------------------------------------------------
  backend-tests:
    runs-on: ubuntu-latest
    # La suite tournait sur SQLite (DB_ENGINE absent -> branche sqlite dans
    # foxugly/settings.py) alors que la production tourne sur PostgreSQL 16
    # (DB_ENGINE=postgresql sur la box). SQLite est plus permissif et laisse
    # passer des requetes que PostgreSQL refuse — c'est ainsi que deux endpoints
    # casses ont vecu en production sur QuizOnline sans qu'aucun test ne les
    # voie. On teste donc sur le moteur de production.
    steps:
      - uses: actions/checkout@v7

      # PostgreSQL n'est pas un `service` : un service se télécharge avant toute
      # étape, sans cache possible, et le registre refuse parfois (Docker Hub,
      # « Data limit exceeded » sur public.ecr.aws) — la CI échouait avant le
      # moindre test. L'image vit dans le cache d'Actions : un téléchargement par
      # mois au plus, trois tentatives, l'image du mois précédent en secours.
      - name: Clé du cache de l'image PostgreSQL (une par mois)
        id: cle-postgres
        run: echo "mois=$(date -u +%Y-%m)" >> "$GITHUB_OUTPUT"

      - name: Image PostgreSQL depuis le cache
        id: cache-postgres
        uses: actions/cache/restore@v6
        with:
          path: /tmp/postgres-16.tar
          key: postgres-16-${{ steps.cle-postgres.outputs.mois }}
          restore-keys: postgres-16-

      - name: Image PostgreSQL depuis le registre (si le cache n'a pas celle du mois)
        id: telechargement-postgres
        if: steps.cache-postgres.outputs.cache-hit != 'true'
        run: |
          for essai in 1 2 3; do
            if docker pull public.ecr.aws/docker/library/postgres:16; then
              docker save public.ecr.aws/docker/library/postgres:16 -o /tmp/postgres-16.tar
              echo "neuve=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep $((essai * 20))
          done
          if [ -f /tmp/postgres-16.tar ]; then
            echo "::warning::Registre indisponible : image du cache d'un mois précédent."
          else
            echo "::error::Registre indisponible et aucune image en cache."
            exit 1
          fi

      - name: Mettre l'image du mois en cache
        if: steps.telechargement-postgres.outputs.neuve == 'true'
        uses: actions/cache/save@v6
        with:
          path: /tmp/postgres-16.tar
          key: postgres-16-${{ steps.cle-postgres.outputs.mois }}

      - name: Démarrer PostgreSQL 16
        run: |
          docker load -i /tmp/postgres-16.tar
          docker run -d --name postgres -p 5432:5432 \
            -e POSTGRES_USER=postgres -e POSTGRES_PASSWORD=postgres -e POSTGRES_DB=foxugly \
            public.ecr.aws/docker/library/postgres:16
          for i in $(seq 1 30); do
            if docker exec postgres pg_isready -U postgres -h 127.0.0.1 >/dev/null 2>&1; then
              echo "PostgreSQL prêt."; exit 0
            fi
            sleep 2
          done
          docker logs postgres
          echo "::error::PostgreSQL ne répond pas."; exit 1
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Tests backend (Django)
        working-directory: backend
        env:
          # Convention DB_* 6 variables de la flotte (OPERATIONS.md §3.13).
          DB_ENGINE: postgresql
          DB_NAME: foxugly
          DB_HOST: localhost
          DB_PORT: '5432'
          DB_USER: postgres
          DB_PASSWORD: postgres
        # `test` sans nom d'app : l'auto-decouverte est le garde-fou anti-derive.
        # Une liste d'apps ecrite en dur finit toujours par oublier une app dont
        # les tests cessent alors de tourner sans que personne ne le voie —
        # QuizOnline y a perdu des centaines de tests.
        run: |
          pip install -r requirements.txt
          python manage.py test -v2

  # ---------------------------------------------------------------------------
  frontend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Tests unitaires frontend (Vitest)
        working-directory: frontend
        run: |
          npm ci
          npx ng test --watch=false

  # ---------------------------------------------------------------------------
  e2e-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Démarrer le backend (migrate + seed + admin)
        working-directory: backend
        env:
          DEBUG: 'true'   # DEBUG défaut False désormais ; dev/e2e l'activent
        run: |
          pip install -r requirements.txt
          python manage.py migrate --noinput
          python manage.py seed_content
          DJANGO_SUPERUSER_PASSWORD=admin12345 \
            python manage.py createsuperuser --noinput --email admin@foxugly.com || true
          nohup python manage.py runserver 127.0.0.1:8001 --noreload > /tmp/backend.log 2>&1 &

      - name: Démarrer le frontend (ng serve + proxy)
        working-directory: frontend
        run: |
          npm ci
          nohup npm start > /tmp/frontend.log 2>&1 &

      - name: Attendre que les serveurs répondent
        run: |
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8001/api/pages/ >/dev/null && break || sleep 2; done
          for i in $(seq 1 60); do curl -sf http://localhost:4200 >/dev/null && break || sleep 2; done
          curl -sf http://127.0.0.1:8001/api/pages/ >/dev/null && echo "backend OK"
          curl -sf http://localhost:4200 >/dev/null && echo "frontend OK"

      - name: Tests e2e (Playwright)
        working-directory: e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npx playwright test

      - name: Logs serveurs (si échec)
        if: failure()
        run: |
          echo "=== backend ==="; tail -50 /tmp/backend.log || true
          echo "=== frontend ==="; tail -50 /tmp/frontend.log || true

  # ---------------------------------------------------------------------------
  deploy:
    needs: [lint-backend, lint-frontend, backend-tests, frontend-tests, e2e-tests]
    # Ne jamais deployer depuis une PR : ce job n'avait aucun garde, seulement
    # `needs` + `environment`. Ajouter le trigger pull_request sans ce `if`
    # aurait declenche un deploiement de production depuis une PR.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # OIDC sub is repo:Foxugly/foxugly_website:environment:production (matches the
    # foxugly-deploy role trust). Also enables GitHub environment protection rules.
    environment: production
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Tag de la release Sentry (SHA du commit)
        run: |
          # Frontend : remplace le placeholder dans sentry.config.ts (build statique).
          sed -i "s|export const SENTRY_RELEASE = '';|export const SENTRY_RELEASE = '${GITHUB_SHA}';|" \
            frontend/src/app/core/sentry.config.ts
          # Backend : fichier RELEASE lu par settings.py (_sentry_release).
          echo "${GITHUB_SHA}" > backend/RELEASE

      - name: Build du frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build      # → frontend/dist/frontend/browser

      - name: Pré-compression des assets (gzip + brotli)
        run: |
          sudo apt-get update && sudo apt-get install -y brotli
          # Crée un .gz et un .br à côté de chaque asset compressible → servis par
          # nginx via gzip_static / brotli_static (aucun CPU au runtime).
          find frontend/dist -type f \
            \( -name '*.js' -o -name '*.css' -o -name '*.html' -o -name '*.svg' \
               -o -name '*.json' -o -name '*.wasm' -o -name '*.txt' -o -name '*.xml' \
               -o -name '*.ico' \) -print0 \
          | while IFS= read -r -d '' f; do
              gzip -9 -k -f "$f"
              brotli -q 11 -f "$f"
            done

      - name: Assemblage du bundle
        run: |
          BUNDLE="foxugly-${GITHUB_SHA::7}.tar.gz"
          echo "BUNDLE=$BUNDLE" >> "$GITHUB_ENV"
          tar czf "$BUNDLE" backend frontend/dist deploy

      - name: Configurer les identifiants AWS (OIDC)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Upload du bundle vers S3
        run: aws s3 cp "$BUNDLE" "s3://$BUCKET/builds/foxugly/$BUNDLE"

      - name: Déploiement via SSM
        env:
          INSTANCE_ID: ${{ secrets.EC2_INSTANCE_ID }}
        run: |
          set -euo pipefail
          # AWS-RunShellScript runs these as ROOT, in order (§3.10 / §3.11 — "the
          # quizonline model"): the trusted CI bundle is extracted ROOT-owned
          # (--no-same-owner), the privileged step is installed to /usr/local/sbin
          # and run from there BEFORE the tree is chown'd to django (so no root-run
          # script and no root-loaded config ever comes from a django-writable
          # file); only the app build runs as django; restart + perms normalization
          # run as root afterwards.
          # Le script privilégié et tout ce qu'il installe (vhost, units) sont lus
          # dans le MIROIR NU DE ROOT (/var/lib/fleet-deploy, root:root 700),
          # alimenté depuis GitHub au SHA poussé — jamais dans l'arbre extrait :
          # ses répertoires existants restent à django, qui pourrait y substituer
          # un fichier entre le `tar` et l'`install` (course → exécution en root).
          M=/var/lib/fleet-deploy/foxugly_website.git
          cat > ssm-params.json <<JSON
          { "commands": [
            "set -eu",
            "export AWS_SHARED_CREDENTIALS_FILE=/dev/null AWS_CONFIG_FILE=/dev/null",
            "aws s3 cp s3://$BUCKET/builds/foxugly/$BUNDLE /tmp/$BUNDLE --region $AWS_REGION",
            "mkdir -p /var/www/django_websites/foxugly",
            "tar --no-same-owner -xzf /tmp/$BUNDLE -C /var/www/django_websites/foxugly",
            "install -d -m 700 -o root -g root /var/lib/fleet-deploy",
            "[ -d $M ] || git init --quiet --bare $M",
            "git --git-dir=$M fetch --quiet --depth=1 https://github.com/Foxugly/foxugly_website.git $GITHUB_SHA",
            "git --git-dir=$M cat-file -e $GITHUB_SHA^{commit}",
            "git --git-dir=$M show $GITHUB_SHA:deploy/foxugly-deploy-privileged.sh > /usr/local/sbin/foxugly-deploy-privileged.sh",
            "chown root:root /usr/local/sbin/foxugly-deploy-privileged.sh && chmod 0755 /usr/local/sbin/foxugly-deploy-privileged.sh",
            "/usr/local/sbin/foxugly-deploy-privileged.sh $M $GITHUB_SHA",
            "chown -R django:www-data /var/www/django_websites/foxugly",
            "sudo -u django bash /var/www/django_websites/foxugly/deploy/ssm-deploy.sh",
            "systemctl restart foxugly-gunicorn",
            "chown -R django:www-data /var/www/django_websites/foxugly && chmod -R g-w,o-rwx /var/www/django_websites/foxugly",
            "rm -f /tmp/$BUNDLE"
          ]}
          JSON

          CMD_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "Deploy foxugly ${GITHUB_SHA::7}" \
            --parameters file://ssm-params.json \
            --query "Command.CommandId" --output text)
          echo "SSM CommandId : $CMD_ID"

          aws ssm wait command-executed --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" || true

          STATUS=$(aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" --query "Status" --output text)
          echo "=== STDOUT ==="
          aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" --query "StandardOutputContent" --output text
          echo "=== STDERR ==="
          aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" --query "StandardErrorContent" --output text
          echo "Statut final : $STATUS"
          test "$STATUS" = "Success"

      - name: Healthcheck du site
        run: |
          set -uo pipefail
          URL="https://www.foxugly.com/health"
          for i in $(seq 1 10); do
            CODE=$(curl -fsS -o /dev/null -w "%{http_code}" "$URL" || echo 000)
            echo "Tentative $i/10 → HTTP $CODE"
            [ "$CODE" = "200" ] && { echo "✓ $URL répond 200"; exit 0; }
            sleep 6
          done
          echo "✗ Healthcheck échoué : $URL ne répond pas 200"
          exit 1

  # Audit des dépendances Python contre la base d'avis PyPI (OSV) : le job échoue
  # sur toute vulnérabilité connue. pip-audit résout l'arbre complet, dépendances
  # transitives comprises, dans un venv jetable ; outil épinglé, cache pip.
  # Exceptions : backend/.pip-audit-ignore, une ligne « ID AAAA-MM-JJ # raison » ;
  # une exception expirée fait échouer le job — à réexaminer, pas à oublier.
  pip-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - name: Install pip-audit (version figée)
        run: python -m pip install pip-audit==2.10.1

      - name: Audit des dépendances
        run: |
          ignore=()
          if [ -f .pip-audit-ignore ]; then
            today=$(date -u +%F)
            while read -r id expiry _ || [ -n "$id" ]; do
              case "$id" in ''|'#'*) continue ;; esac
              if [[ ! "$expiry" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then
                echo "::error::.pip-audit-ignore : date d'expiration manquante pour $id"; exit 1
              fi
              if [[ "$expiry" < "$today" ]]; then
                echo "::error::.pip-audit-ignore : l'exception $id a expiré le $expiry"; exit 1
              fi
              ignore+=(--ignore-vuln "$id")
            done < .pip-audit-ignore
          fi
          pip-audit --progress-spinner off -r requirements.txt -r requirements-dev.txt "${ignore[@]}"
